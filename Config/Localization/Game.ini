; Loop9 localization pipeline (target "Game").
;
; One command gathers all NSLOCTEXT/LOCTEXT strings from C++ and FText from
; assets, imports translations from Content/Localization/Game/<culture>/Game.po,
; compiles Game.locres binaries, and re-exports updated PO files:
;
;   UnrealEditor-Cmd <path>/Loop9.uproject -run=GatherText -config="Config/Localization/Game.ini"
;
; Workflow (like web i18n):
;   1. Add/change NSLOCTEXT strings in code (English source).
;   2. Run the command above -> sr/Game.po gets new entries with empty msgstr.
;   3. Fill in translations in sr/Game.po (any text editor / POEdit).
;   4. Run the command again -> Game.locres is compiled with the translations.

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
ResourceName=Game.locres
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=sr
CulturesToGenerate=de
CulturesToGenerate=fr
CulturesToGenerate=ru

; --- Gather from C++ source ---
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/Loop9
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

; --- Gather FText properties from assets (widgets, data assets, maps) ---
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/L10N/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

; --- Import existing translations from PO files ---
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true

; --- Compile binary .locres used by the game at runtime ---
[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource

; --- Re-export PO files so translators always see the latest strings ---
[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
ShouldPersistCommentsOnExport=true
